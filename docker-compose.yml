services:
  mysql-exporter:
    image: prom/mysqld-exporter:v0.19.0
    restart: unless-stopped
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend, monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8080/stub_status"]
    depends_on: [nginx]
    networks: [frontend, monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8084:8080"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker:/var/lib/docker:ro"]
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports: ["127.0.0.1:9091:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    networks: [monitoring]

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes: ["./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro", "loki_data:/loki"]
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-news-portal}
    volumes: ["./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "/var/lib/docker/containers:/var/lib/docker/containers:ro", "promtail_positions:/tmp"]
    depends_on: [loki]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: ["grafana_data:/var/lib/grafana", "./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/news-portal.yml:ro", "./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/news-portal.yml:ro", "./monitoring/dashboards:/etc/grafana/provisioning/dashboards/files:ro"]
    depends_on: [prometheus, loki]
    networks: [monitoring]

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8089:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: news_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: news_portal
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [backend, frontend]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: news_portal
      MYSQL_USER: news_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql", "./database/init/00-create-exporter-user.sh:/docker-entrypoint-initdb.d/00-create-exporter-user.sh:ro", "./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro", "./database/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports: ["127.0.0.1:8083:80"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

volumes:
  mysql_data:
    name: news_portal_mysql_data
  prometheus_data:
    name: news_portal_prometheus_data
  grafana_data:
    name: news_portal_grafana_data
  loki_data:
    name: news_portal_loki_data
  promtail_positions:
    name: news_portal_promtail_positions

networks:
  backend:
  frontend:
  monitoring:
